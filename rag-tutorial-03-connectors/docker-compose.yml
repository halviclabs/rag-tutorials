# Local infrastructure for Part 2:
#   - postgres: PostgreSQL with the pgvector extension (store profile "pgvector")
#   - ollama:   local LLM runtime for Mistral + nomic-embed-text (provider profile "ollama")
#
# Start what you need:
#   docker compose up -d postgres        # only the database
#   docker compose up -d ollama          # only local models
#   docker compose up -d                 # both
#
# After the first ollama start, pull the models once:
#   docker compose exec ollama ollama pull mistral
#   docker compose exec ollama ollama pull nomic-embed-text
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
