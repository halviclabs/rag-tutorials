apiVersion: v1
kind: Service
metadata:
  name: {{ include "rag-tutorial.fullname" . }}-backend
  labels:
    {{- include "rag-tutorial.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
