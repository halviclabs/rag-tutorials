apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "rag-tutorial.fullname" . }}-backend-config
  labels:
    {{- include "rag-tutorial.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.backend.springProfiles | quote }}
  {{- if .Values.postgres.enabled }}
  POSTGRES_URL: "jdbc:postgresql://{{ include "rag-tutorial.fullname" . }}-postgres:5432/{{ .Values.postgres.database }}"
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  {{- end }}
  {{- if .Values.ollama.enabled }}
  OLLAMA_BASE_URL: "http://{{ include "rag-tutorial.fullname" . }}-ollama:11434"
  {{- end }}
  {{- range $key, $value := .Values.backend.config }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
