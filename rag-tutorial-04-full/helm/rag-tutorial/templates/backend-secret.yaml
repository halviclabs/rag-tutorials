apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rag-tutorial.fullname" . }}-backend-secrets
  labels:
    {{- include "rag-tutorial.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  {{- end }}
  {{- range $key, $value := .Values.backend.secrets }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
