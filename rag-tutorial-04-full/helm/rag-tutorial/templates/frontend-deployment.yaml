apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rag-tutorial.fullname" . }}-frontend
  labels:
    {{- include "rag-tutorial.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        {{- include "rag-tutorial.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            # nginx proxies /api, /teams and /slack here (see nginx.conf.template)
            - name: BACKEND_URL
              value: "http://{{ include "rag-tutorial.fullname" . }}-backend:8080"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
