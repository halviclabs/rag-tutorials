apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rag-tutorial.fullname" . }}-backend
  labels:
    {{- include "rag-tutorial.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "rag-tutorial.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        # roll the pods when config or secrets change
        checksum/config: {{ include (print $.Template.BasePath "/backend-configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/backend-secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "rag-tutorial.fullname" . }}-backend-config
            - secretRef:
                name: {{ include "rag-tutorial.fullname" . }}-backend-secrets
          readinessProbe:
            httpGet:
              path: /api/documents
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/documents
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
